version: "2"

linters:
  enable:
    - bodyclose
    - exhaustive
    - goprintffuncname
    - govet
    - ineffassign
    - misspell
    - nakedret
    - noctx
    - staticcheck
    - unconvert
    - unparam
    - unused
    - whitespace
    - asciicheck
    - gocyclo
    - gocritic
    - errcheck
    - thelper
    - tparallel
    - predeclared
    - nilerr
    - makezero
    - forbidigo
    - errname
    - nilnil
    - usetesting
    - bidichk
    - containedctx
    - decorder
    - dogsled
    - dupword
    - durationcheck
    - errname
    - ginkgolinter
    - gocheckcompilerdirectives
    - godox
    - nilnil
    - perfsprint
  settings:
    forbidigo:
      analyze-types: true
      exclude-godoc-examples: false
      forbid:
        # Preserve the existing restrictions on direct printing.
        - pattern: '^(fmt\.Print(f|ln)?|print|println)$'
          msg: Use the configured logger outside command output
        - pattern: '^log\.(Logger\.)?Print(f|ln)?$'
          pkg: '^log$'
          msg: Use logging.FromContext(ctx) instead of standard logging
  exclusions:
    rules:
      - path: cmd\/*
        text: Use the configured logger outside command output
        linters:
          - forbidigo
      - path: internal\/ci\/*
        text: Use the configured logger outside command output
        linters:
          - forbidigo
      - path: internal\/validation\/*
        text: Use the configured logger outside command output
        linters:
          - forbidigo
      - path: internal\/tui\/*
        text: Use the configured logger outside command output
        linters:
          - forbidigo
      - path: internal\/account-api\/*
        text: Use the configured logger outside command output
        linters:
          - forbidigo

formatters:
  enable:
    - gofmt
    - gci
  settings:
    gci:
      sections:
        - Standard
        - Default
        - "Prefix(github.com/shopware/shopware-cli)"
  
