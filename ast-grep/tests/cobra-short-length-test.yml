id: cobra-short-length
valid:
  # Count Unicode characters, not UTF-8 bytes.
  - 'var cmd = &cobra.Command{Short: "É123456789012345678901234567890123456789012345678901234567890123456789012345678"}'
  # 79 characters; exactly 80 must fail.
  - 'var cmd = &cobra.Command{Short: "1234567890123456789012345678901234567890123456789012345678901234567890123456789"}'
  - 'var cmd = &cobra.Command{Short: "Build assets"}'
  - 'var cmd = &cobra.Command{Short: generator.Short}'
  - 'var cmd = &cobra.Command{Short: "Build " + "12345678901234567890123456789012345678901234567890123456789012345678901234567890"}'
  - 'var cmd = &cobra.Command{Short: "1234567890123456789012345678901234567890123456789012345678901234567890123456789\n"}'
  - 'var cmd = &cobra.Command{Short: `12345678901234567890123456789012345678901234567890123456789012345678901234567890`}'
  - 'var other = Other{Short: "12345678901234567890123456789012345678901234567890123456789012345678901234567890"}'
  - 'var cmd = &cobra.Command{Other: Other{Short: "12345678901234567890123456789012345678901234567890123456789012345678901234567890"}}'
invalid:
  - 'var cmd = &cobra.Command{Short: "É1234567890123456789012345678901234567890123456789012345678901234567890123456789"}'
  - 'var cmd = &cobra.Command{Short: "12345678901234567890123456789012345678901234567890123456789012345678901234567890"}'
  - |
    var cmd = &cobra.Command{
      Use: "build",
      Short: "123456789012345678901234567890123456789012345678901234567890123456789012345678901", // Keep this comment
    }
