# Project development tools and repeatable commands.
#
# Keep this file limited to tools and tasks that are useful to contributors.
# Personal overrides belong in mise.local.toml, which is intentionally ignored.

[tools]
# Keep this aligned with the Go minor version declared in go.mod.
# Run `mise upgrade go` to install the latest patch release.
go = "1.27"

# Pin the linter so local results do not change when a new release is published.
# Keep this in sync with the version in .github/workflows/lint.yml.
golangci-lint = "2.15.0"

# Keep this aligned with .github/workflows/actionlint.yml.
actionlint = "1.7.12"
shellcheck = "0.11.0"

[env]
# Match CI and prevent Go from silently downloading a different toolchain.
GOTOOLCHAIN = "local"

[tasks.format]
description = "Format Go source files"
run = "golangci-lint fmt ./..."

[tasks.format-check]
description = "Check that Go source files are formatted"
run = "golangci-lint fmt --diff ./..."

[tasks.build]
description = "Build the shopware-cli binary"
run = "go build -o ./bin/shopware-cli ."

[tasks.test]
description = "Run the network-isolated test suite"
run = "./scripts/run-tests.sh"

[tasks.test-unit]
description = "Run Go tests without the repository sandbox wrapper"
run = "go test ./..."

[tasks.vet]
description = "Run the Go vet checks"
run = "go vet ./..."

[tasks.lint]
description = "Run golangci-lint"
run = "golangci-lint run ./... --timeout 4m"

[tasks.check]
description = "Run formatting, build, tests, vet, and lint checks"
depends = ["format-check", "build", "test", "vet", "lint", "lint-workflows"]

[tasks.lint-workflows]
description = "Validate GitHub Actions workflows"
# Require ShellCheck so embedded shell scripts are always validated.
run = ["shellcheck --version", "actionlint -color -shellcheck=shellcheck -pyflakes="]
