# Project development tools and repeatable commands.
#
# Keep this file limited to tools and tasks that are useful to contributors.
# Personal overrides belong in mise.local.toml, which is intentionally ignored.

[settings]
lockfile = true

# Set the Go minor version in .tool-versions to keep Go out of mise.lock
# and let patch releases float.
[tools]
# Pin the linter so local results do not change when a new release is published.
# Keep this in sync with the version in .github/workflows/lint.yml.
golangci-lint = "2.15.0"

# Structural project convention checks, shared by local tasks and CI.
ast-grep = "0.51.3"

# Workflow tools are shared by local tasks and CI; checksums are in mise.lock.
jactionlint = "2.6.0"
shellcheck = "0.11.0"

# Markdown tooling is shared by local tasks and CI.
rumdl = "0.3.5"

[env]
# Match CI and prevent Go from silently downloading a different toolchain.
GOTOOLCHAIN = "local"

[tasks.format]
description = "Format Go and Markdown files"
depends = ["format-go", "format-markdown"]

[tasks.format-go]
description = "Format Go source files"
run = "golangci-lint fmt ./..."

[tasks.format-check]
description = "Check Go and Markdown formatting"
depends = ["format-check-go", "lint-markdown"]

[tasks.format-check-go]
description = "Check Go formatting"
run = "golangci-lint fmt --diff ./..."

[tasks.build]
description = "Build the shopware-cli binary"
run = "go build -o ./bin/shopware-cli ."

[tasks.cache-clear]
description = "Clear the global shopware-cli cache. Development builds need manual clearing after tool or config changes; releases use a fresh cache per version."
run = "go run ./scripts/clear-cache.go"

[tasks.test]
description = "Run the network-isolated test suite"
run = "./scripts/run-tests.sh"

[tasks.test-unit]
description = "Run Go tests without the repository sandbox wrapper"
run = "go test ./..."

[tasks.vet]
description = "Run the Go vet checks"
run = "go vet ./..."

[tasks.lint]
description = "Lint Go, Markdown, and project conventions"
depends = ["lint-go", "lint-markdown", "lint-conventions"]

[tasks.lint-go]
description = "Lint Go source files"
run = "golangci-lint run ./... --timeout 4m"

[tasks.check]
description = "Run formatting, build, tests, vet, and lint checks"
depends = ["format-check", "build", "test", "vet", "lint", "lint-workflows", "test-lint-rules"]

[tasks.lint-conventions]
description = "Check project conventions"
run = "ast-grep scan ."

[tasks.test-lint-rules]
description = "Test project lint rules and fixes"
run = [
    "ast-grep test --skip-snapshot-tests",
    "bash scripts/test-convention-fixes.sh",
]

[tasks.fix-conventions]
description = "Apply project convention fixes"
run = "ast-grep scan . --update-all"

[tasks.lint-workflows]
description = "Validate GitHub Actions workflows"
# Require ShellCheck so embedded shell scripts are always validated.
run = [
    "shellcheck --version",
    "jactionlint --color --shellcheck=shellcheck --pyflakes=",
    # Scaffolded templates track action versions by tag, not by SHA.
    "jactionlint --color --shellcheck=shellcheck --pyflakes= --ignore=unpinned-uses internal/shop/project_scaffold_static/github-ci.yml.tmpl internal/shop/project_scaffold_static/github-deploy.yml.tmpl",
]

[tasks.lint-markdown]
description = "Lint Markdown files"
run = "rumdl check ."

[tasks.format-markdown]
description = "Format Markdown files and report remaining lint findings"
run = "rumdl check --fix ."
