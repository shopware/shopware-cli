name: Check Markdown

on:
  pull_request:
    paths:
      - '**/*.md'
      - '**/*.mdx'
      - '.markdownlint-cli2.yaml'
      - '.prettierrc.json'
      - '.prettierignore'
      - '.gitignore'
      - 'mise.toml'
      - '.github/workflows/markdown.yml'
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - '**/*.mdx'
      - '.markdownlint-cli2.yaml'
      - '.prettierrc.json'
      - '.prettierignore'
      - '.gitignore'
      - 'mise.toml'
      - '.github/workflows/markdown.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  markdown:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # ratchet:step-security/harden-runner@v2.22.2
        with:
          egress-policy: block
          disable-sudo: true
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            mise.jdx.dev:443
            nodejs.org:443
            objects.githubusercontent.com:443
            registry.npmjs.org:443
            release-assets.githubusercontent.com:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Markdown tools
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # ratchet:jdx/mise-action@v3
        with:
          install_args: node npm:markdownlint-cli2 npm:prettier

      - name: Lint Markdown
        run: mise run --skip-tools lint-markdown

      - name: Check Markdown formatting
        run: mise run --skip-tools format-markdown-check
