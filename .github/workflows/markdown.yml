name: Check Markdown

on:
  pull_request:
    paths:
      - '**/*.md'
      - '**/*.mdx'
      - '.rumdl.toml'
      - '.gitignore'
      - 'mise.toml'
      - 'mise.lock'
      - '.github/workflows/markdown.yml'
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - '**/*.mdx'
      - '.rumdl.toml'
      - '.gitignore'
      - 'mise.toml'
      - 'mise.lock'
      - '.github/workflows/markdown.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  markdown:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2.22.3
        with:
          egress-policy: block
          disable-sudo: true
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            mise.jdx.dev:443
            mise-versions.jdx.dev:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            tuf-repo-cdn.sigstore.dev:443

      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Markdown tools
        uses: jdx/mise-action@v5.2.6
        with:
          install_args: --locked rumdl

      - name: Check Markdown
        run: mise run --skip-tools lint-markdown
