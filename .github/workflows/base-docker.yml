name: Update Base Docker Image
on:
  workflow_dispatch:
  push:
    tags-ignore:
      - "*"
    branches:
      - main
    paths:
      - 'Dockerfile.base'
      - 'scripts/entrypoint.sh'
      - 'tests/container-structure-test.yaml'
      - '.github/workflows/base-docker.yml'
      - 'internal/verifier/js/**'
      - 'internal/verifier/php/**'
  pull_request:
    paths:
      - 'Dockerfile.base'
      - 'scripts/entrypoint.sh'
      - 'tests/container-structure-test.yaml'
      - '.github/workflows/base-docker.yml'
      - 'internal/verifier/js/**'
      - 'internal/verifier/php/**'
permissions:
  contents: read
  id-token: write
  packages: write

jobs:
  structure-test:
    name: Test base image structure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # ratchet:docker/setup-buildx-action@v4.4.1

      - name: Build image under test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # ratchet:docker/build-push-action@v7.4.0
        with:
          context: .
          file: Dockerfile.base
          load: true
          tags: shopware-cli-base:structure-test
          build-args: |
            PHP_VERSION=8.3
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install container-structure-test
        env:
          CONTAINER_STRUCTURE_TEST_VERSION: v1.22.1
          CONTAINER_STRUCTURE_TEST_SHA256: fa35e89512a8978585f76cf41397956d2e3a30c62c2ad3fb857b1597074d14ca
        run: |
          curl --fail --silent --show-error --location \
            --output container-structure-test \
            "https://github.com/GoogleContainerTools/container-structure-test/releases/download/${CONTAINER_STRUCTURE_TEST_VERSION}/container-structure-test-linux-amd64"
          echo "${CONTAINER_STRUCTURE_TEST_SHA256}  container-structure-test" | sha256sum --check
          chmod +x container-structure-test

      - name: Test image structure
        run: |
          ./container-structure-test test \
            --image shopware-cli-base:structure-test \
            --config tests/container-structure-test.yaml

  build:
    name: Build PHP ${{ matrix.php-version }}
    needs: structure-test
    strategy:
      matrix:
        php-version: ["8.5", "8.4", "8.3", "8.2"]
    uses: docker/github-builder/.github/workflows/build.yml@58cb9f5b71b1836d6f690c1e95effdeb9b98cb8a # ratchet:docker/github-builder/.github/workflows/build.yml@v1
    permissions:
      contents: read
      id-token: write
      packages: write
    with:
      output: image
      push: ${{ github.event_name != 'pull_request' }}
      platforms: linux/amd64,linux/arm64
      file: Dockerfile.base
      build-args: |
        PHP_VERSION=${{ matrix.php-version }}
      meta-images: |
        ghcr.io/shopware/shopware-cli-base
      meta-tags: |
        type=raw,value=${{ matrix.php-version }}
      meta-flavor: |
        latest=false
      cache: true
      cache-mode: max
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
