name: Build env-bridge Docker Image

on:
  workflow_dispatch:
  push:
    tags-ignore:
      - "*"
    branches:
      - main
    paths:
      - 'env-bridge/**'
      - 'internal/envfile/**'
      - 'Dockerfile.env-bridge'
      - '.github/workflows/env-bridge-docker.yml'
  pull_request:
    paths:
      - 'env-bridge/**'
      - 'internal/envfile/**'
      - 'Dockerfile.env-bridge'
      - '.github/workflows/env-bridge-docker.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ghcr.io/shopware/shopware-cli/env-bridge
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - name: Build and push
        # Keep publishing cache performance; changes to cache policy are deferred.
        # jactionlint ignore=cache-poisoning
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: Dockerfile.env-bridge
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
