name: Publish Config Schemas

on:
  push:
    branches: ["main"]
    paths:
      - 'internal/shop/config_schema.json'
      - 'internal/extension/config_schema.json'
      - '.github/workflows/schema-pages.yml'
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2.22.3
        with:
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Assemble Pages site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p _site
          cp internal/shop/config_schema.json _site/shopware-project-schema.json
          cp internal/extension/config_schema.json _site/shopware-extension-schema.json

          VERSION=$(gh api "repos/${{ github.repository }}/releases/latest" --jq .tag_name 2>/dev/null || true)
          RELEASE_TIME=$(gh api "repos/${{ github.repository }}/releases/latest" --jq .published_at 2>/dev/null || true)
          VERSION="${VERSION#v}"
          if [ -z "$VERSION" ]; then
            VERSION="dev"
          fi

          jq -n --arg version "$VERSION" --arg release_time "$RELEASE_TIME" '{version: $version, release_time: $release_time}' > _site/version.json

          cat > _site/index.html <<EOF
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <title>shopware-cli config schemas</title>
          </head>
          <body>
            <h1>shopware-cli config schemas</h1>
            <p>Latest release: <code>${VERSION}</code></p>
            <ul>
              <li><a href="version.json">version.json</a> &mdash; latest CLI version</li>
              <li><a href="shopware-project-schema.json">shopware-project-schema.json</a> &mdash; schema for <code>.config/shopware-project.yml</code></li>
              <li><a href="shopware-extension-schema.json">shopware-extension-schema.json</a> &mdash; schema for <code>.config/shopware-extension.yml</code></li>
            </ul>
          </body>
          </html>
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5.0.0

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
