name: Agent Skills links

on:
  schedule:
    # Mondays; an odd minute avoids the start-of-hour load that delays scheduled runs.
    - cron: '23 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    # External links in versioned skills (docs/AGENT_SKILLS.md#contributor-skills);
    # relative links are checked on every pull request by the skills contract test.
    if: github.repository == 'shopware/shopware-cli' || github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2.23.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Check links
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          args: --no-progress --max-retries 3 'skills/shopware-contribute-*/**/*.md'
          fail: true
