version: 2
# Retain the existing default cooldown and weekly schedule rather than requiring
# the seven-day cooldown recommended by jactionlint.
updates:
  # jactionlint ignore=dependabot-cooldown
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: 'fix(deps): '
    groups:
      all:
        patterns:
          - '*'
  # jactionlint ignore=dependabot-cooldown
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: 'fix(deps): '
    groups:
      all:
        patterns:
          - '*'  

  # jactionlint ignore=dependabot-cooldown
  - package-ecosystem: "composer"
    directory: "/internal/verifier/php"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: 'fix(deps): '
    groups:
      all:
        patterns:
          - '*'

  # jactionlint ignore=dependabot-cooldown
  - package-ecosystem: "npm"
    directory: "/internal/verifier/js"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: 'fix(deps): '
    groups:
      all:
        patterns:
          - '*'
